<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R36S screens</title>
<style>
  :root {
    --bg: #0a0a10; --panel: #12121c; --line: #2a2a3c; --text: #ececf4; --dim: #8a8aa0;
    --c0: #ff4848; --c1: #ff9234; --c2: #ffd63c; --c3: #b0ea40; --c4: #48e070; --c5: #30dcc8;
    --c6: #38baff; --c7: #5c80ff; --c8: #9670ff; --c9: #d668ff; --c10: #ff54ce; --c11: #ff8096;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Terminus", "JetBrains Mono", ui-monospace, monospace; }
  header { padding: 20px 16px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
  header p { margin: 4px 0 0; color: var(--dim); }
  .rule { display: flex; height: 3px; margin-top: 12px; }
  .rule span { flex: 1; }
  nav { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  nav div { max-width: 1400px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  nav a { color: var(--bg); text-decoration: none; padding: 2px 8px; border-radius: 3px; font-weight: bold; }
  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 40px; }
  h2 { font-size: 15px; margin: 24px 0 10px; padding-left: 8px; border-left: 4px solid; scroll-margin-top: 48px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; cursor: zoom-in; }
  figure:hover, figure:focus { border-color: var(--text); outline: none; }
  figure img { display: block; width: 100%; height: auto; image-rendering: pixelated; aspect-ratio: 4 / 3; }
  figcaption { padding: 6px 10px 8px; }
  figcaption b { display: block; }
  figcaption b i { font-style: normal; color: var(--dim); margin-right: 8px; }
  figcaption span { color: var(--dim); font-size: 13px; }
  #box { position: fixed; inset: 0; background: rgba(0, 0, 0, .92); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5; }
  #box.on { display: flex; }
  #box img { image-rendering: pixelated; max-width: 100vw; }
  #box p { margin: 10px 16px 0; text-align: center; }
  #box p span { color: var(--dim); }
  #box small { color: var(--dim); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>R36S RHYTHM MACHINE — ALL SCREENS</h1>
  <p>Draft 1, 2026-10-09. 640×480, drawn pixel for pixel. Working name STICKS. Values are examples.</p>
  <div class="rule" id="rule"></div>
</header>
<nav><div id="nav"></div></nav>
<main id="main"></main>
<div id="box" role="dialog" aria-modal="true">
  <img id="big" alt="">
  <p id="cap"></p>
  <small>← → next and previous · 1× 2× 3×: keys 1 2 3 · Esc closes</small>
</div>
<script>
const groups = [
  ['Play and write', 0, [
    ['01-boot', 'BOOT', 'On in about 2 s. The log is also a hardware check.'],
    ['02-menu', 'MENU', 'SELECT opens every screen. SELECT + D-pad jumps.'],
    ['03-pattern', 'PATTERN', 'Home. 12 tracks by 16 steps, a synth track selected.'],
    ['04-pattern-sample', 'PATTERN', 'A sample track selected: its slices under the grid.'],
    ['05-step', 'STEP', 'X on a step: velocity, nudge, ratchet, chance, locks.'],
    ['06-pads', 'PADS', 'Hold L1: D-pad and ABXY play 8 tracks and record.'],
    ['07-generate', 'GENERATE', 'Euclid per track, dice with a wildness amount, fills.'],
    ['08-perform', 'PERFORM', 'Right stick over 8 live effects. Mutes, scenes, motion.']]],
  ['Arrange', 2, [
    ['09-patterns', 'PATTERNS', 'Banks A-H, 16 patterns each. Queue the next one.'],
    ['10-song', 'SONG', 'A chain of patterns with repeats.']]],
  ['Sound', 4, [
    ['11-kit', 'KIT', 'All 12 sounds: engine, level, pan, choke, MIDI note.'],
    ['12-sound-synth', 'SOUND · SYNTH', "thump's drum engine, one section at a time."],
    ['13-sound-fm', 'SOUND · FM', '4 operators, 8 algorithms, pitch envelope.'],
    ['14-sample', 'SAMPLE', 'Trim, slice, loop, process. Bits and rate.'],
    ['15-sampling', 'SAMPLING', "Record TWOFOLD's inputs, or resample the output."]]],
  ['Mix', 6, [
    ['16-mixer', 'MIXER', '12 strips and the master. Drive and sends per track.'],
    ['17-fx', 'FX', 'Tape delay after the PT2399 pedal, reverb, sends.'],
    ['18-master', 'MASTER', 'Compressor, tone, limiter, and the codec rate.']]],
  ['Files', 8, [
    ['19-browser', 'BROWSER', 'Samples, drums, kits, patterns, projects. Plays as you move.'],
    ['20-confirm', 'CONFIRM', 'Asks before throwing work away.'],
    ['21-project', 'PROJECT', 'Save, open, render song, loops or stems to WAV.'],
    ['22-name', 'NAME', 'Typing with the D-pad.'],
    ['23-usb-drive', 'USB DRIVE', 'Plugged into a computer, the card is a drive.']]],
  ['Connect', 10, [
    ['24-midi', 'MIDI', 'USB to a computer or to devices. Notes, clock, monitor.'],
    ['25-sync', 'SYNC', 'Clock, tap, and sync pulses out of the headphone jack.']]],
  ['System', 11, [
    ['26-settings', 'SETTINGS', 'The CONTROLS page: dead zone, curves, assignments.'],
    ['27-button-map', 'BUTTON MAP', 'What every button does.'],
    ['28-diagnostics', 'DIAGNOSTICS', 'Bring-up page. The values are examples.']]],
];
const col = i => `var(--c${i})`;
const all = [];
const rule = document.getElementById('rule'), nav = document.getElementById('nav'), main = document.getElementById('main');
for (let i = 0; i < 12; i++) rule.insertAdjacentHTML('beforeend', `<span style="background:${col(i)}"></span>`);
groups.forEach(([name, c, shots], g) => {
  nav.insertAdjacentHTML('beforeend', `<a href="#g${g}" style="background:${col(c)}">${name}</a>`);
  const sec = document.createElement('section');
  sec.innerHTML = `<h2 id="g${g}" style="border-color:${col(c)}">${name}</h2><div class="grid"></div>`;
  const grid = sec.querySelector('.grid');
  for (const [file, title, desc] of shots) {
    const n = all.length;
    all.push({ file, title, desc });
    const f = document.createElement('figure');
    f.tabIndex = 0;
    f.innerHTML = `<img src="screens/${file}.png" width="640" height="480" loading="lazy" alt="${title}">
      <figcaption><b><i>${file.slice(0, 2)}</i>${title}</b><span>${desc}</span></figcaption>`;
    f.onclick = () => show(n);
    f.onkeydown = e => { if (e.key === 'Enter') show(n); };
    grid.appendChild(f);
  }
  main.appendChild(sec);
});
const box = document.getElementById('box'), big = document.getElementById('big'), cap = document.getElementById('cap');
let cur = 0, zoom = 0;
function fit() {
  const s = zoom || Math.max(1, Math.floor(Math.min(innerWidth / 640, (innerHeight - 90) / 480)));
  big.style.width = 640 * s + 'px';
}
function show(n) {
  cur = (n + all.length) % all.length;
  const s = all[cur];
  big.src = `screens/${s.file}.png`;
  big.alt = s.title;
  cap.innerHTML = `${s.file.slice(0, 2)}  ${s.title} <span>— ${s.desc}</span>`;
  box.classList.add('on');
  fit();
}
box.onclick = e => { if (e.target === box) box.classList.remove('on'); };
big.onclick = () => show(cur + 1);
addEventListener('resize', fit);
addEventListener('keydown', e => {
  if (!box.classList.contains('on')) return;
  if (e.key === 'Escape') box.classList.remove('on');
  else if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
  else if (e.key === 'ArrowLeft') show(cur - 1);
  else if ('0123'.includes(e.key)) { zoom = +e.key; fit(); }
});
</script>
</body>
</html>
